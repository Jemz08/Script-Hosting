<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Script Manager</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10;
    --panel: #12151a;
    --panel-hi: #171b22;
    --border: #1f242c;
    --border-hi: #2c3440;
    --text: #e6e8eb;
    --muted: #7d8694;
    --dim: #565e6b;
    --accent: #8fd3ff;
    --success: #1d7a4a;
    --danger: #a03a3a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .app {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: 100vh;
    height: 100dvh;
  }
  /* sidebar */
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-head {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    flex: 1;
  }
  .new-btn {
    background: var(--accent);
    color: var(--bg);
    border: 0;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  .new-btn:hover { opacity: 0.9; }
  .list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .item {
    padding: 10px 12px;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 2px;
    transition: background .12s;
  }
  .item:hover { background: var(--panel-hi); }
  .item.active { background: var(--panel-hi); box-shadow: inset 2px 0 0 var(--accent); }
  .item-name {
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-meta {
    font-size: 11px;
    color: var(--dim);
    margin-top: 2px;
  }
  .sidebar-foot {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--dim);
  }
  .sidebar-foot button {
    background: 0;
    border: 0;
    color: var(--dim);
    font: inherit;
    font-size: 11px;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
  }
  .sidebar-foot button:hover { color: var(--text); }
  /* main */
  .main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }
  .toolbar {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    flex-shrink: 0;
    background: var(--bg);
    position: relative;
    z-index: 2;
  }
  .toolbar input[type="text"] {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font: inherit;
    font-size: 14px;
    padding: 8px 12px;
    border-radius: 6px;
    outline: none;
    transition: border-color .15s;
    min-width: 0;
  }
  .toolbar input[type="text"]:focus { border-color: var(--border-hi); }
  #name { flex: 1; font-weight: 600; }
  #desc { flex: 2; font-size: 13px; }
  .btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font: inherit;
    font-size: 12px;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: all .12s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .btn:hover { border-color: var(--border-hi); background: var(--panel-hi); }
  .btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { opacity: 0.9; }
  .btn.danger { color: #e18a8a; }
  .btn.danger:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
  .btn.ok { background: var(--success); color: #fff; border-color: var(--success); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  /* editor */
  .editor-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }
  #editor {
    width: 100%;
    height: 100%;
    background: transparent;
    border: 0;
    outline: none;
    resize: none;
    color: #cfd6de;
    font: inherit;
    font-size: 13px;
    line-height: 1.65;
    padding: 20px 24px;
    tab-size: 2;
    white-space: pre;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
  }
  /* loadstring bar */
  .ls-bar {
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    gap: 10px;
    align-items: center;
    background: var(--panel);
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .ls-label {
    font-size: 11px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .ls-value {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 12px;
    font-size: 12px;
    color: var(--accent);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
    user-select: all;
    min-width: 200px;
  }
  /* gate */
  .gate {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: grid;
    place-items: center;
    z-index: 100;
    padding: 24px;
  }
  .gate-inner {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    width: 100%;
    max-width: 360px;
  }
  .gate h2 { margin: 0 0 6px; font-size: 17px; }
  .gate p { margin: 0 0 20px; font-size: 13px; color: var(--muted); }
  .gate input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font: inherit;
    padding: 11px 14px;
    border-radius: 6px;
    outline: none;
    margin-bottom: 12px;
  }
  .gate input:focus { border-color: var(--border-hi); }
  .gate button {
    width: 100%;
    background: var(--accent);
    border: 0;
    color: var(--bg);
    font: inherit;
    font-weight: 600;
    padding: 11px;
    border-radius: 6px;
    cursor: pointer;
  }
  .gate .err { color: #e18a8a; font-size: 12px; margin-top: 10px; min-height: 16px; }
  /* toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--success);
    color: #fff;
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: var(--danger); }
  .empty {
    display: grid;
    place-items: center;
    height: 100%;
    color: var(--dim);
    font-size: 13px;
    text-align: center;
    padding: 40px;
  }
  /* mobile */
  .mobile-toggle { display: none; }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: 280px;
      z-index: 50;
      transform: translateX(-100%);
      transition: transform .2s;
    }
    .sidebar.open { transform: translateX(0); }
    .mobile-toggle {
      display: inline-flex;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      font: inherit;
      font-size: 16px;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }
    #desc { display: none; }

    .toolbar {
      padding: 10px 12px;
      gap: 8px;
      flex-wrap: nowrap;
    }
    #name {
      font-size: 13px;
      padding: 8px 10px;
    }
    .toolbar .btn {
      padding: 8px 10px;
      font-size: 12px;
    }
    .ls-bar {
      padding: 10px 12px;
      gap: 8px;
    }
    .ls-value { font-size: 11px; }
  }
</style>
</head>
<body>

<div class="gate" id="gate" style="display:none">
  <div class="gate-inner">
    <h2>Script Manager</h2>
    <p>Enter your edit password to continue.</p>
    <input id="gate-pass" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="gate-btn">Unlock</button>
    <div class="err" id="gate-err"></div>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand">Scripts</div>
      <button class="new-btn" id="new-btn">+ New</button>
    </div>
    <div class="list" id="list"></div>
    <div class="sidebar-foot">
      <button id="lock-btn">Lock</button>
      <span id="count"></span>
    </div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <button class="mobile-toggle" id="mobile-toggle">☰</button>
      <input id="name" type="text" placeholder="Script name" />
      <input id="desc" type="text" placeholder="Short description (optional)" />
      <button class="btn primary" id="save-btn">Save</button>
      <button class="btn danger" id="delete-btn" style="display:none">Delete</button>
    </div>

    <div class="editor-wrap">
      <textarea id="editor" spellcheck="false" placeholder="-- paste your Lua here"></textarea>
    </div>

    <div class="ls-bar" id="ls-bar" style="display:none">
      <span class="ls-label">Loadstring</span>
      <div class="ls-value" id="ls-value" title="Click to copy"></div>
      <button class="btn" id="ls-copy">Copy</button>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const state = {
    password: localStorage.getItem('sm_pass') || '',
    scripts: [],
    currentId: null,
  };

  let toastTimer;
  function toast(msg, isErr) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.toggle('err', !!isErr);
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
  }

  function fmtDate(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const now = Date.now();
    const diff = (now - ts) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return d.toLocaleDateString();
  }

  async function api(path, opts) {
    opts = opts || {};
    const headers = Object.assign({
      'Content-Type': 'application/json',
      'x-edit-password': state.password,
    }, opts.headers || {});
    const res = await fetch(path, Object.assign({}, opts, { headers }));
    if (res.status === 401) {
      lock('Session expired. Enter password again.');
      throw new Error('unauthorized');
    }
    return res;
  }

  async function copyText(t, msg) {
    try { await navigator.clipboard.writeText(t); }
    catch {
      const ta = document.createElement('textarea');
      ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch {}
      ta.remove();
    }
    toast(msg || 'Copied');
  }

  function loadstringFor(id) {
    return `loadstring(game:HttpGet("${location.origin}/api/s/${id}"))()`;
  }

  // ---- gate ----
  function showGate() {
    $('gate').style.display = 'grid';
    $('app').style.display = 'none';
    setTimeout(() => $('gate-pass').focus(), 50);
  }
  function hideGate() {
    $('gate').style.display = 'none';
    $('app').style.display = 'grid';
  }
  function lock(msg) {
    state.password = '';
    localStorage.removeItem('sm_pass');
    if (msg) $('gate-err').textContent = msg;
    showGate();
  }

  async function tryUnlock(pass) {
    state.password = pass;
    try {
      const res = await fetch('/api/scripts', {
        headers: { 'x-edit-password': pass },
      });
      if (res.status === 401) {
        state.password = '';
        $('gate-err').textContent = 'Wrong password.';
        return false;
      }
      if (!res.ok) {
        $('gate-err').textContent = 'Server error: ' + res.status;
        return false;
      }
      const data = await res.json();
      state.scripts = data.scripts || [];
      localStorage.setItem('sm_pass', pass);
      $('gate-err').textContent = '';
      hideGate();
      renderList();
      return true;
    } catch (e) {
      $('gate-err').textContent = 'Network error: ' + e.message;
      return false;
    }
  }

  $('gate-btn').addEventListener('click', () => tryUnlock($('gate-pass').value));
  $('gate-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') tryUnlock($('gate-pass').value);
  });
  $('lock-btn').addEventListener('click', () => lock());

  // ---- list ----
  function renderList() {
    const list = $('list');
    list.innerHTML = '';
    state.scripts.forEach(s => {
      const el = document.createElement('div');
      el.className = 'item' + (s.id === state.currentId ? ' active' : '');
      el.innerHTML = `
        <div class="item-name"></div>
        <div class="item-meta">${fmtDate(s.updatedAt)}</div>
      `;
      el.querySelector('.item-name').textContent = s.name || '(untitled)';
      el.addEventListener('click', () => openScript(s.id));
      list.appendChild(el);
    });
    $('count').textContent = state.scripts.length
      ? ` · ${state.scripts.length} script${state.scripts.length === 1 ? '' : 's'}`
      : '';
  }

  function openScript(id) {
    const s = state.scripts.find(x => x.id === id);
    if (!s) return;
    state.currentId = id;
    $('name').value = s.name || '';
    $('desc').value = s.description || '';
    $('editor').value = s.code || '';
    $('delete-btn').style.display = '';
    $('ls-bar').style.display = 'flex';
    $('ls-value').textContent = loadstringFor(id);
    $('sidebar').classList.remove('open');
    renderList();
  }

  function newScript() {
    state.currentId = null;
    $('name').value = '';
    $('desc').value = '';
    $('editor').value = '-- new script\n';
    $('delete-btn').style.display = 'none';
    $('ls-bar').style.display = 'none';
    $('sidebar').classList.remove('open');
    $('name').focus();
    renderList();
  }

  $('new-btn').addEventListener('click', newScript);

  // ---- save ----
  $('save-btn').addEventListener('click', async () => {
    const name = $('name').value.trim();
    const code = $('editor').value;
    const description = $('desc').value.trim();
    if (!name) return toast('Name required', true);
    if (!code) return toast('Code required', true);

    const btn = $('save-btn');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      const res = await api('/api/scripts', {
        method: 'POST',
        body: JSON.stringify({ id: state.currentId, name, code, description }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'save failed');

      const saved = data.script;
      state.currentId = saved.id;
      const idx = state.scripts.findIndex(s => s.id === saved.id);
      if (idx >= 0) state.scripts[idx] = saved;
      else state.scripts.unshift(saved);
      state.scripts.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

      $('delete-btn').style.display = '';
      $('ls-bar').style.display = 'flex';
      $('ls-value').textContent = loadstringFor(saved.id);
      renderList();
      toast('Saved');
    } catch (e) {
      if (e.message !== 'unauthorized') toast(e.message || 'Save failed', true);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save';
    }
  });

  // ---- delete ----
  $('delete-btn').addEventListener('click', async () => {
    if (!state.currentId) return;
    if (!confirm('Delete this script? This cannot be undone.')) return;
    try {
      const res = await api('/api/scripts/' + state.currentId, { method: 'DELETE' });
      if (!res.ok) throw new Error('delete failed');
      state.scripts = state.scripts.filter(s => s.id !== state.currentId);
      newScript();
      toast('Deleted');
    } catch (e) {
      if (e.message !== 'unauthorized') toast('Delete failed', true);
    }
  });

  // ---- loadstring copy ----
  function copyLs() {
    if (!state.currentId) return;
    copyText(loadstringFor(state.currentId), 'Loadstring copied');
  }
  $('ls-value').addEventListener('click', copyLs);
  $('ls-copy').addEventListener('click', copyLs);

  // ---- editor key handling ----
  $('editor').addEventListener('keydown', e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const t = e.target;
      const start = t.selectionStart;
      const end = t.selectionEnd;
      t.value = t.value.substring(0, start) + '  ' + t.value.substring(end);
      t.selectionStart = t.selectionEnd = start + 2;
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      $('save-btn').click();
    }
  });

  // ---- mobile ----
  $('mobile-toggle').addEventListener('click', () => {
    $('sidebar').classList.toggle('open');
  });

  // ---- boot ----
  (async function boot() {
    if (!state.password) return showGate();
    const ok = await tryUnlock(state.password);
    if (!ok) showGate();
  })();
})();
</script>
</body>
</html>
