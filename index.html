<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Script Manager</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10;
    --panel: #12151a;
    --panel-hi: #171b22;
    --border: #1f242c;
    --border-hi: #2c3440;
    --text: #e6e8eb;
    --muted: #7d8694;
    --dim: #565e6b;
    --accent: #8fd3ff;
    --success: #1d7a4a;
    --danger: #a03a3a;
    --syn-keyword: #ff7bc7;
    --syn-string: #a5e075;
    --syn-comment: #5a6673;
    --syn-number: #f2b16a;
    --syn-function: #8fd3ff;
    --syn-builtin: #c39fff;
    --syn-operator: #8a94a1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  .app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; height: 100dvh; }
  /* sidebar */
  .sidebar { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; position: relative; z-index: 60; }
  .sidebar-head { padding: 14px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .brand { font-size: 14px; font-weight: 600; flex: 1; }
  .head-btn {
    background: var(--panel-hi); color: var(--text); border: 1px solid var(--border);
    font: inherit; font-size: 12px; font-weight: 600; padding: 6px 10px;
    border-radius: 6px; cursor: pointer; transition: all .12s; white-space: nowrap;
  }
  .head-btn:hover { border-color: var(--border-hi); background: #1c2128; }
  .head-btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .head-btn.primary:hover { opacity: 0.9; background: var(--accent); }
  .head-btn.upload-btn { flex-basis: 100%; margin-top: 6px; font-size: 11px; letter-spacing: 0.04em; text-align: center; }
  .list { flex: 1; overflow-y: auto; padding: 8px; }
  .item { padding: 10px 12px; border-radius: 6px; cursor: pointer; margin-bottom: 2px; transition: background .12s; }
  .item:hover { background: var(--panel-hi); }
  .item.active { background: var(--panel-hi); box-shadow: inset 2px 0 0 var(--accent); }
  .item-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
  .item-name .lock { font-size: 10px; color: var(--accent); flex-shrink: 0; }
  .item-name span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-meta { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .sidebar-foot { padding: 12px 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--dim); display: flex; align-items: center; gap: 10px; }
  .sidebar-foot button { background: 0; border: 0; color: var(--dim); font: inherit; font-size: 11px; cursor: pointer; padding: 0; text-decoration: underline; }
  .sidebar-foot button:hover { color: var(--text); }
  .backdrop { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); z-index: 55; opacity: 0; transition: opacity .2s; }
  .backdrop.show { display: block; opacity: 1; }
  /* main */
  .main { display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .toolbar { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-shrink: 0; background: var(--bg); }
  .toolbar input[type="text"] { background: var(--panel); border: 1px solid var(--border); color: var(--text); font: inherit; font-size: 14px; padding: 8px 12px; border-radius: 6px; outline: none; min-width: 0; }
  .toolbar input[type="text"]:focus { border-color: var(--border-hi); }
  #name { flex: 1; font-weight: 600; }
  .btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); font: inherit; font-size: 12px; padding: 8px 14px; border-radius: 6px; cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: all .12s; }
  .btn:hover { border-color: var(--border-hi); background: var(--panel-hi); }
  .btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  .btn.danger { color: #e18a8a; }
  .btn.danger:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.toggle.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  .btn.icon { padding: 6px 10px; font-size: 13px; line-height: 1; }
  /* search row */
  .search-row {
    display: flex; gap: 6px; align-items: center;
    padding: 8px 16px; background: var(--bg);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .search-icon { color: var(--dim); font-size: 14px; flex-shrink: 0; }
  .search-input {
    flex: 1; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); font: inherit; font-size: 12px;
    padding: 6px 10px; border-radius: 5px; outline: none; min-width: 0;
  }
  .search-input:focus { border-color: var(--border-hi); }
  .search-count {
    font-size: 11px; color: var(--dim); min-width: 60px;
    text-align: right; flex-shrink: 0;
  }
  .search-count.err { color: #e18a8a; }
  /* editor */
  .editor-wrap { flex: 1; min-height: 0; position: relative; margin: 14px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); overflow: hidden; transition: border-color .15s; }
  .editor-wrap:focus-within { border-color: var(--border-hi); }
  .editor-wrap.dragover { border-color: var(--accent); background: #131b24; }
  .editor-wrap.dragover::after {
    content: 'Drop .lua file';
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(11, 13, 16, 0.85); color: var(--accent);
    font-size: 14px; font-weight: 600; z-index: 5; pointer-events: none;
  }
  .editor-label { position: absolute; top: 0; left: 0; padding: 6px 12px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); background: var(--panel); border-bottom-right-radius: 6px; z-index: 3; pointer-events: none; }
  /* highlight layer + textarea stack */
  .code-container { position: absolute; inset: 0; overflow: hidden; }
  .code-highlight,
  #editor {
    position: absolute; inset: 0;
    margin: 0; border: 0; outline: none;
    font: inherit; font-size: 13px; line-height: 1.65;
    padding: 32px 16px 16px 16px;
    tab-size: 2;
    white-space: pre;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    word-wrap: normal;
    overflow-wrap: normal;
  }
  .code-highlight {
    color: #cfd6de;
    background: transparent;
    pointer-events: none;
    z-index: 1;
  }
  #editor {
    color: transparent;
    background: transparent;
    caret-color: #cfd6de;
    z-index: 2;
    resize: none;
    -webkit-text-fill-color: transparent;
  }
  #editor::selection { background: rgba(143, 211, 255, 0.25); }
  #editor::placeholder { color: var(--dim); -webkit-text-fill-color: var(--dim); }
  .code-highlight .tok-keyword { color: var(--syn-keyword); font-weight: 600; }
  .code-highlight .tok-string { color: var(--syn-string); }
  .code-highlight .tok-comment { color: var(--syn-comment); font-style: italic; }
  .code-highlight .tok-number { color: var(--syn-number); }
  .code-highlight .tok-function { color: var(--syn-function); }
  .code-highlight .tok-builtin { color: var(--syn-builtin); }
  .code-highlight .tok-operator { color: var(--syn-operator); }
  /* obfuscator panel */
  .obf-panel { padding: 10px 16px; border-top: 1px solid var(--border); background: var(--bg); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; flex-shrink: 0; font-size: 12px; }
  .obf-panel label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .obf-panel label.switch { display: inline-flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--text); cursor: pointer; user-select: none; }
  .obf-panel label.switch input { appearance: none; -webkit-appearance: none; width: 34px; height: 20px; background: var(--border); border-radius: 10px; position: relative; cursor: pointer; transition: background .15s; margin: 0; }
  .obf-panel label.switch input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: transform .15s; }
  .obf-panel label.switch input:checked { background: var(--accent); }
  .obf-panel label.switch input:checked::after { transform: translateX(14px); }
  .obf-panel select { background: var(--panel); border: 1px solid var(--border); color: var(--text); font: inherit; font-size: 12px; padding: 5px 8px; border-radius: 4px; outline: none; }
  /* loadstring bar */
  .ls-bar { border-top: 1px solid var(--border); padding: 12px 16px; display: flex; gap: 8px; align-items: center; background: var(--panel); flex-shrink: 0; flex-wrap: wrap; }
  .ls-label { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; flex-shrink: 0; }
  .ls-value { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 9px 12px; font-size: 12px; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; user-select: all; min-width: 200px; }
  /* modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); z-index: 300; padding: 20px; align-items: center; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 780px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; }
  .modal-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .modal-title { font-size: 14px; font-weight: 600; flex: 1; }
  .modal-sub { font-size: 11px; color: var(--dim); }
  .modal-close { background: 0; border: 0; color: var(--muted); font: inherit; font-size: 22px; line-height: 1; cursor: pointer; padding: 0 4px; }
  .modal-close:hover { color: var(--text); }
  .modal-body { flex: 1; overflow: auto; margin: 0; padding: 16px 18px; font: inherit; font-size: 12px; line-height: 1.6; color: #cfd6de; background: var(--bg); white-space: pre; -webkit-overflow-scrolling: touch; word-break: break-all; }
  .modal-foot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; }
  /* gate */
  .gate { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; z-index: 100; padding: 24px; }
  .gate-inner { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 28px; width: 100%; max-width: 360px; }
  .gate h2 { margin: 0 0 6px; font-size: 17px; }
  .gate p { margin: 0 0 20px; font-size: 13px; color: var(--muted); }
  .gate input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); font: inherit; padding: 11px 14px; border-radius: 6px; outline: none; margin-bottom: 12px; }
  .gate button { width: 100%; background: var(--accent); border: 0; color: var(--bg); font: inherit; font-weight: 600; padding: 11px; border-radius: 6px; cursor: pointer; }
  .gate .err { color: #e18a8a; font-size: 12px; margin-top: 10px; min-height: 16px; }
  /* toast */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--success); color: #fff; font-size: 13px; padding: 10px 18px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 400; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: var(--danger); }
  #file-input { display: none; }
  /* mobile */
  .mobile-toggle { display: none; }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: fixed; inset: 0 auto 0 0; width: 280px; max-width: 82vw; z-index: 60; transform: translateX(-100%); transition: transform .2s; }
    .sidebar.open { transform: translateX(0); }
    .mobile-toggle { display: inline-flex; background: var(--panel); border: 1px solid var(--border); color: var(--text); font: inherit; font-size: 16px; padding: 6px 12px; border-radius: 6px; cursor: pointer; flex-shrink: 0; }
    .toolbar { padding: 10px 12px; gap: 6px; }
    #name { font-size: 13px; padding: 8px 10px; }
    .toolbar .btn { padding: 8px 10px; font-size: 12px; }
    .search-row { padding: 6px 12px; gap: 4px; }
    .search-count { min-width: 48px; font-size: 10px; }
    .editor-wrap { margin: 10px 12px; }
    .code-highlight, #editor { font-size: 12px; padding: 30px 12px 12px 12px; }
    .obf-panel { padding: 8px 12px; gap: 8px; }
    .ls-bar { padding: 10px 12px; gap: 6px; }
    .ls-value { font-size: 11px; flex-basis: 100%; order: 3; }
    .ls-label { width: 100%; }
    .modal { max-height: 92vh; }
    .modal-body { font-size: 11px; padding: 12px 14px; }
  }
</style>
</head>
<body>

<div class="gate" id="gate" style="display:none">
  <div class="gate-inner">
    <h2>Script Manager</h2>
    <p>Enter your edit password to continue.</p>
    <input id="gate-pass" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="gate-btn">Unlock</button>
    <div class="err" id="gate-err"></div>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>

<div class="app" id="app" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand">Scripts</div>
      <button class="head-btn primary" id="new-btn">+ New</button>
      <button class="head-btn upload-btn" id="upload-btn">UPLOAD lua/luau</button>
    </div>
    <div class="list" id="list"></div>
    <div class="sidebar-foot">
      <button id="lock-btn">Lock</button>
      <span id="count"></span>
    </div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <button class="mobile-toggle" id="mobile-toggle">☰</button>
      <input id="name" type="text" placeholder="Script name" />
      <button class="btn primary" id="save-btn">Save</button>
      <button class="btn danger" id="delete-btn" style="display:none">Delete</button>
    </div>

    <div class="search-row">
      <span class="search-icon">⌕</span>
      <input id="search-input" class="search-input" type="text" placeholder="Search in script…" autocomplete="off" spellcheck="false" />
      <span class="search-count" id="search-count">—</span>
      <button class="btn icon" id="search-prev" title="Previous">↑</button>
      <button class="btn icon" id="search-next" title="Next">↓</button>
    </div>

    <div class="editor-wrap" id="editor-wrap">
      <div class="editor-label" id="editor-label">Lua source</div>
      <div class="code-container">
        <pre class="code-highlight" id="code-highlight" aria-hidden="true"></pre>
        <textarea id="editor" spellcheck="false" autocorrect="off" autocapitalize="off" placeholder="-- paste your Lua here, or tap UPLOAD in the sidebar"></textarea>
      </div>
    </div>

    <div class="obf-panel" id="obf-panel" style="display:none">
      <label class="switch">
        <input type="checkbox" id="obf-on" />
        <span>Obfuscate</span>
      </label>
      <select id="obf-preset" title="Preset">
        <option value="Minify">Minify</option>
        <option value="Weak">Weak</option>
        <option value="Medium" selected>Medium</option>
        <option value="Strong">Strong</option>
      </select>
      <select id="obf-version" title="Lua version">
        <option value="Lua51">Lua51</option>
        <option value="LuaU" selected>LuaU</option>
      </select>
      <label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0">
        <input type="checkbox" id="obf-pretty" /> Pretty
      </label>
      <span id="obf-status" style="color:var(--muted);margin-left:auto;font-size:11px"></span>
    </div>

    <div class="ls-bar" id="ls-bar" style="display:none">
      <span class="ls-label">Loadstring</span>
      <div class="ls-value" id="ls-value" title="Click to copy"></div>
      <button class="btn" id="ls-copy">Copy</button>
      <button class="btn" id="ls-view">Served</button>
      <button class="btn" id="ls-download">.lua</button>
      <button class="btn toggle" id="obf-toggle" title="Quick toggle obfuscation">Obfuscate</button>
    </div>
  </main>
</div>

<div class="modal-overlay" id="served-modal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="served-title">Served output</div>
      <span class="modal-sub" id="served-sub"></span>
      <button class="modal-close" id="served-close">×</button>
    </div>
    <pre class="modal-body" id="served-body">Loading…</pre>
    <div class="modal-foot">
      <button class="btn primary" id="served-copy">Copy all</button>
      <button class="btn" id="served-download">Download .lua</button>
    </div>
  </div>
</div>

<input type="file" id="file-input" accept=".lua,.luau,.txt,text/plain" />

<div class="toast" id="toast"></div>

<script type="module">
import ObfWorker from './src/worker/prometheus.worker.js?worker';

const $ = id => document.getElementById(id);
const state = {
  password: localStorage.getItem('sm_pass') || '',
  scripts: [],
  currentId: null,
  obfuscate: false,
  servedCache: null,
  searchMatches: [],
  searchIndex: -1,
};

// ---- worker ----
let worker = null;
let workerReqId = 0;
let workerPending = new Map();

function getWorker() {
  if (worker) return worker;
  worker = new ObfWorker();
  worker.addEventListener('message', (e) => {
    const { id } = e.data;
    const pending = workerPending.get(id);
    if (!pending) return;
    workerPending.delete(id);
    if (e.data.ok) pending.resolve(e.data);
    else pending.reject(new Error(e.data.error || 'Obfuscation failed'));
  });
  worker.addEventListener('error', (e) => {
    for (const p of workerPending.values()) p.reject(new Error(e.message || 'Worker error'));
    workerPending.clear();
    worker = null;
  });
  return worker;
}

function runObfuscation({ source, preset, luaVersion, prettyPrint }) {
  return new Promise((resolve, reject) => {
    const id = ++workerReqId;
    workerPending.set(id, { resolve, reject });
    getWorker().postMessage({
      id, source,
      filename: 'script.lua',
      preset, luaVersion, prettyPrint,
      seed: Math.floor(Math.random() * 2147483646) + 1,
    });
  });
}

// ---- toast ----
let toastTimer;
function toast(msg, isErr) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.toggle('err', !!isErr);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

function fmtDate(ts) {
  if (!ts) return '';
  const diff = (Date.now() - ts) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return new Date(ts).toLocaleDateString();
}

function fmtBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / (1024 * 1024)).toFixed(2) + ' MB';
}

async function api(path, opts) {
  opts = opts || {};
  const headers = Object.assign({
    'Content-Type': 'application/json',
    'x-edit-password': state.password,
  }, opts.headers || {});
  const res = await fetch(path, Object.assign({}, opts, { headers }));
  if (res.status === 401) { lock('Session expired.'); throw new Error('unauthorized'); }
  return res;
}

async function copyText(t, msg) {
  try { await navigator.clipboard.writeText(t); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch {}
    ta.remove();
  }
  toast(msg || 'Copied');
}

function loadstringFor(id) {
  return `loadstring(game:HttpGet("${location.origin}/api/s/${id}"))()`;
}

// ---- gate ----
function showGate() { $('gate').style.display = 'grid'; $('app').style.display = 'none'; setTimeout(() => $('gate-pass').focus(), 50); }
function hideGate() { $('gate').style.display = 'none'; $('app').style.display = 'grid'; }
function lock(msg) {
  state.password = '';
  localStorage.removeItem('sm_pass');
  if (msg) $('gate-err').textContent = msg;
  showGate();
}

async function tryUnlock(pass) {
  state.password = pass;
  try {
    const res = await fetch('/api/scripts', { headers: { 'x-edit-password': pass } });
    if (res.status === 401) { state.password = ''; $('gate-err').textContent = 'Wrong password.'; return false; }
    if (!res.ok) { $('gate-err').textContent = 'Server error: ' + res.status; return false; }
    const data = await res.json();
    state.scripts = data.scripts || [];
    localStorage.setItem('sm_pass', pass);
    $('gate-err').textContent = '';
    hideGate();
    renderList();
    return true;
  } catch (e) {
    $('gate-err').textContent = 'Network error: ' + e.message;
    return false;
  }
}

$('gate-btn').addEventListener('click', () => tryUnlock($('gate-pass').value));
$('gate-pass').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock($('gate-pass').value); });
$('lock-btn').addEventListener('click', () => lock());

// ---- sidebar open/close ----
function openSidebar() { $('sidebar').classList.add('open'); $('backdrop').classList.add('show'); document.body.style.overflow = 'hidden'; }
function closeSidebar() { $('sidebar').classList.remove('open'); $('backdrop').classList.remove('show'); document.body.style.overflow = ''; }
function toggleSidebar() { if ($('sidebar').classList.contains('open')) closeSidebar(); else openSidebar(); }
$('mobile-toggle').addEventListener('click', toggleSidebar);
$('backdrop').addEventListener('click', closeSidebar);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('served-modal').classList.contains('show')) closeServedModal();
    else closeSidebar();
  }
});

// ---- list ----
function renderList() {
  const list = $('list');
  list.innerHTML = '';
  state.scripts.forEach(s => {
    const el = document.createElement('div');
    el.className = 'item' + (s.id === state.currentId ? ' active' : '');
    const nameRow = document.createElement('div');
    nameRow.className = 'item-name';
    const nameSpan = document.createElement('span');
    nameSpan.textContent = s.name || '(untitled)';
    nameRow.appendChild(nameSpan);
    if (s.obfuscated) {
      const lock = document.createElement('span');
      lock.className = 'lock'; lock.textContent = '🔒'; lock.title = 'Obfuscated';
      nameRow.appendChild(lock);
    }
    el.appendChild(nameRow);
    const meta = document.createElement('div');
    meta.className = 'item-meta';
    meta.textContent = fmtDate(s.updatedAt);
    el.appendChild(meta);
    el.addEventListener('click', () => { openScript(s.id); closeSidebar(); });
    list.appendChild(el);
  });
  $('count').textContent = state.scripts.length ? ` · ${state.scripts.length}` : '';
}

async function openScript(id) {
  try {
    const res = await api('/api/scripts/' + id);
    if (!res.ok) throw new Error('fetch failed');
    const { script: s } = await res.json();
    state.currentId = id;
    state.servedCache = null;
    $('name').value = s.name || '';
    setEditorValue(s.rawCode || s.code || '');
    $('delete-btn').style.display = '';
    $('ls-bar').style.display = 'flex';
    $('obf-panel').style.display = 'flex';
    $('ls-value').textContent = loadstringFor(id);
    state.obfuscate = !!s.obfuscated;
    $('obf-on').checked = state.obfuscate;
    $('obf-toggle').classList.toggle('active', state.obfuscate);
    if (s.obfuscator) {
      $('obf-preset').value = s.obfuscator.preset || 'Medium';
      $('obf-version').value = s.obfuscator.luaVersion || 'LuaU';
      $('obf-pretty').checked = !!s.obfuscator.prettyPrint;
    }
    renderList();
  } catch (e) {
    toast('Could not load script', true);
  }
}

function newScript() {
  state.currentId = null;
  state.servedCache = null;
  $('name').value = '';
  setEditorValue('-- new script\n');
  $('delete-btn').style.display = 'none';
  $('ls-bar').style.display = 'none';
  $('obf-panel').style.display = 'none';
  state.obfuscate = false;
  $('obf-on').checked = false;
  $('obf-toggle').classList.remove('active');
  clearSearch();
  closeSidebar();
  $('name').focus();
  renderList();
}

$('new-btn').addEventListener('click', () => { newScript(); closeSidebar(); });

// ---- file upload ----
function loadFileIntoEditor(file) {
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) return toast('File too large (max 5 MB)', true);
  const reader = new FileReader();
  reader.onload = () => {
    const text = String(reader.result || '');
    setEditorValue(text);
    if (!state.currentId && !$('name').value.trim()) {
      const base = file.name.replace(/\.(lua|luau|txt)$/i, '');
      $('name').value = base;
    }
    if (!state.currentId) {
      $('delete-btn').style.display = 'none';
      $('ls-bar').style.display = 'none';
      $('obf-panel').style.display = 'flex';
    }
    toast('Loaded ' + file.name);
    closeSidebar();
  };
  reader.onerror = () => toast('Failed to read file', true);
  reader.readAsText(file);
}

$('upload-btn').addEventListener('click', () => $('file-input').click());
$('file-input').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  loadFileIntoEditor(file);
  e.target.value = '';
});

const editorWrap = $('editor-wrap');
['dragenter', 'dragover'].forEach(ev => {
  editorWrap.addEventListener(ev, (e) => {
    e.preventDefault(); e.stopPropagation();
    editorWrap.classList.add('dragover');
  });
});
['dragleave', 'drop'].forEach(ev => {
  editorWrap.addEventListener(ev, (e) => {
    e.preventDefault(); e.stopPropagation();
    if (ev === 'dragleave' && editorWrap.contains(e.relatedTarget)) return;
    editorWrap.classList.remove('dragover');
  });
});
editorWrap.addEventListener('drop', (e) => {
  const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  loadFileIntoEditor(file);
});

// ---- obfuscate toggle ----
function setObfuscate(on) {
  state.obfuscate = on;
  $('obf-on').checked = on;
  $('obf-toggle').classList.toggle('active', on);
}
$('obf-toggle').addEventListener('click', () => setObfuscate(!state.obfuscate));
$('obf-on').addEventListener('change', () => setObfuscate($('obf-on').checked));

// ---- save ----
$('save-btn').addEventListener('click', async () => {
  const name = $('name').value.trim();
  const rawCode = $('editor').value;
  if (!name) return toast('Name required', true);
  if (!rawCode) return toast('Code required', true);

  const btn = $('save-btn');
  let code = rawCode;
  let obfuscated = false;
  let obfuscator = null;
  const isFirstObfSave = state.obfuscate && !state.currentId;

  if (state.obfuscate) {
    btn.disabled = true;
    btn.textContent = 'Obfuscating…';
    $('obf-status').textContent = 'working…';
    try {
      const preset = $('obf-preset').value;
      const luaVersion = $('obf-version').value;
      const prettyPrint = $('obf-pretty').checked;
      const result = await runObfuscation({ source: rawCode, preset, luaVersion, prettyPrint });
      code = result.output;
      obfuscated = true;
      obfuscator = { preset, luaVersion, prettyPrint };
      $('obf-status').textContent = 'done';
      setTimeout(() => { $('obf-status').textContent = ''; }, 2000);
    } catch (e) {
      $('obf-status').textContent = 'failed';
      toast('Obfuscation failed: ' + e.message, true);
      btn.disabled = false;
      btn.textContent = 'Save';
      return;
    }
  }

  btn.disabled = true;
  btn.textContent = 'Saving…';

  try {
    const res = await api('/api/scripts', {
      method: 'POST',
      body: JSON.stringify({
        id: state.currentId, name, rawCode, code, obfuscated, obfuscator,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'save failed');
    const saved = data.script;
    state.currentId = saved.id;
    state.servedCache = null;
    const idx = state.scripts.findIndex(s => s.id === saved.id);
    if (idx >= 0) state.scripts[idx] = saved;
    else state.scripts.unshift(saved);
    state.scripts.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    $('delete-btn').style.display = '';
    $('ls-bar').style.display = 'flex';
    $('obf-panel').style.display = 'flex';
    $('ls-value').textContent = loadstringFor(saved.id);
    renderList();
    toast(obfuscated ? 'Saved (obfuscated)' : 'Saved');
    if (isFirstObfSave && obfuscated) {
      setTimeout(() => openServedModal(), 400);
    }
  } catch (e) {
    if (e.message !== 'unauthorized') toast(e.message || 'Save failed', true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save';
  }
});

// ---- delete ----
$('delete-btn').addEventListener('click', async () => {
  if (!state.currentId) return;
  if (!confirm('Delete this script?')) return;
  try {
    const res = await api('/api/scripts/' + state.currentId, { method: 'DELETE' });
    if (!res.ok) throw new Error('delete failed');
    state.scripts = state.scripts.filter(s => s.id !== state.currentId);
    newScript();
    toast('Deleted');
  } catch (e) {
    if (e.message !== 'unauthorized') toast('Delete failed', true);
  }
});

// ---- loadstring copy ----
function copyLs() {
  if (!state.currentId) return;
  copyText(loadstringFor(state.currentId), 'Loadstring copied');
}
$('ls-value').addEventListener('click', copyLs);
$('ls-copy').addEventListener('click', copyLs);

// ---- served modal ----
async function fetchServed() {
  if (!state.currentId) throw new Error('no script');
  if (state.servedCache !== null) return state.servedCache;
  const res = await fetch(`/api/s/${state.currentId}`, { cache: 'no-store' });
  const text = await res.text();
  state.servedCache = text;
  return text;
}

async function openServedModal() {
  if (!state.currentId) return;
  const modal = $('served-modal');
  const body = $('served-body');
  const current = state.scripts.find(s => s.id === state.currentId);
  $('served-title').textContent = (current?.name || 'script') + ' — served output';
  $('served-sub').textContent = current?.obfuscated ? 'obfuscated' : 'raw';
  body.textContent = 'Loading…';
  modal.classList.add('show');
  try {
    const text = await fetchServed();
    body.textContent = text || '(empty)';
    $('served-sub').textContent = (current?.obfuscated ? 'obfuscated · ' : 'raw · ') + fmtBytes(new Blob([text]).size);
  } catch (e) {
    body.textContent = 'Failed to load: ' + e.message;
  }
}

function closeServedModal() { $('served-modal').classList.remove('show'); }
$('served-close').addEventListener('click', closeServedModal);
$('served-modal').addEventListener('click', e => { if (e.target === $('served-modal')) closeServedModal(); });
$('served-copy').addEventListener('click', async () => {
  try {
    const text = await fetchServed();
    await copyText(text, 'Served output copied');
    const b = $('served-copy');
    b.textContent = 'Copied';
    setTimeout(() => { b.textContent = 'Copy all'; }, 1400);
  } catch (e) { toast('Copy failed', true); }
});
$('served-download').addEventListener('click', () => downloadServed());
$('ls-view').addEventListener('click', openServedModal);
$('ls-download').addEventListener('click', () => downloadServed());

async function downloadServed() {
  if (!state.currentId) return;
  try {
    const text = await fetchServed();
    const current = state.scripts.find(s => s.id === state.currentId);
    const base = (current?.name || 'script').replace(/[^a-z0-9_-]+/gi, '_') || 'script';
    const suffix = current?.obfuscated ? '-obfuscated' : '';
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = base + suffix + '.lua';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Downloaded');
  } catch (e) { toast('Download failed', true); }
}

// ==================================================================
// SYNTAX HIGHLIGHTING
// ==================================================================

const LUA_KEYWORDS = new Set([
  'and','break','do','else','elseif','end','false','for','function','goto',
  'if','in','local','nil','not','or','repeat','return','then','true','until','while',
  'continue','export','type','typeof',
]);
const LUA_BUILTINS = new Set([
  'print','warn','error','assert','pcall','xpcall','select','type','tostring','tonumber',
  'pairs','ipairs','next','unpack','table','string','math','os','io','coroutine','debug',
  'game','workspace','script','Instance','Vector3','Vector2','CFrame','Color3','UDim2',
  'UDim','Ray','Region3','Enum','task','tick','wait','spawn','delay','require','setmetatable',
  'getmetatable','rawget','rawset','rawequal','loadstring','load','collectgarbage',
  'GetService','FindFirstChild','WaitForChild','GetChildren','GetDescendants','Destroy',
  'Clone','Connect','Fire','Invoke','IsA','HttpGet',
]);
const LUA_TOKEN_RE = /(\-\-\[\[[\s\S]*?\]\])|(\-\-[^\n]*)|(\[\[[\s\S]*?\]\])|("(?:\\.|[^"\\])*")|('(?:\\.|[^'\\])*')|(\b\d+(?:\.\d+)?(?:[eE][+\-]?\d+)?\b)|(\b[A-Za-z_][A-Za-z0-9_]*\b)/g;

function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;');
}

function highlightLua(src) {
  let out = '';
  let last = 0;
  let m;
  LUA_TOKEN_RE.lastIndex = 0;
  while ((m = LUA_TOKEN_RE.exec(src)) !== null) {
    out += escapeHtml(src.slice(last, m.index));
    const tok = m[0];
    let cls;
    if (m[1] || m[2]) cls = 'tok-comment';
    else if (m[3] || m[4] || m[5]) cls = 'tok-string';
    else if (m[6]) cls = 'tok-number';
    else {
      const word = tok;
      if (LUA_KEYWORDS.has(word)) cls = 'tok-keyword';
      else if (LUA_BUILTINS.has(word)) cls = 'tok-function';
      else {
        const after = src.slice(LUA_TOKEN_RE.lastIndex, LUA_TOKEN_RE.lastIndex + 8);
        if (/^\s*\(/.test(after)) cls = 'tok-function';
        else cls = null;
      }
    }
    out += cls ? `<span class="${cls}">${escapeHtml(tok)}</span>` : escapeHtml(tok);
    last = LUA_TOKEN_RE.lastIndex;
  }
  out += escapeHtml(src.slice(last));
  return out;
}

let hlTimer = null;
function refreshHighlight() {
  if (hlTimer) return;
  hlTimer = requestAnimationFrame(() => {
    hlTimer = null;
    const src = $('editor').value;
    $('code-highlight').innerHTML = highlightLua(src) + '\n';
  });
}

function syncScroll() {
  const ed = $('editor');
  const hl = $('code-highlight');
  hl.scrollTop = ed.scrollTop;
  hl.scrollLeft = ed.scrollLeft;
}
$('editor').addEventListener('scroll', syncScroll);

// ==================================================================
// SEARCH
// ==================================================================

function clearSearch() {
  $('search-input').value = '';
  $('search-count').textContent = '—';
  $('search-count').classList.remove('err');
  state.searchMatches = [];
  state.searchIndex = -1;
}

// Count matches. If `jump` is true, also move selection to the current match.
// While typing in the search box we call with jump=false so focus stays put.
function runSearch(jump) {
  const q = $('search-input').value;
  const text = $('editor').value;
  const count = $('search-count');
  state.searchMatches = [];
  if (!q) {
    count.textContent = '—';
    count.classList.remove('err');
    state.searchIndex = -1;
    return;
  }
  const lowerQ = q.toLowerCase();
  const lowerText = text.toLowerCase();
  let i = 0;
  while (i <= lowerText.length) {
    const found = lowerText.indexOf(lowerQ, i);
    if (found === -1) break;
    state.searchMatches.push(found);
    i = found + Math.max(1, q.length);
    if (state.searchMatches.length > 5000) break;
  }
  if (state.searchMatches.length === 0) {
    count.textContent = 'no match';
    count.classList.add('err');
    state.searchIndex = -1;
    return;
  }
  count.classList.remove('err');
  if (state.searchIndex < 0 || state.searchIndex >= state.searchMatches.length) {
    state.searchIndex = 0;
  }
  count.textContent = `${state.searchIndex + 1} / ${state.searchMatches.length}`;
  if (jump) focusMatch();
}

function focusMatch() {
  if (state.searchIndex < 0 || !state.searchMatches.length) return;
  const ed = $('editor');
  const pos = state.searchMatches[state.searchIndex];
  const len = $('search-input').value.length;
  ed.focus();
  ed.setSelectionRange(pos, pos + len);
  const lineHeight = 13 * 1.65;
  const before = ed.value.slice(0, pos);
  const lineNum = (before.match(/\n/g) || []).length;
  const targetTop = Math.max(0, lineNum * lineHeight - ed.clientHeight / 3);
  ed.scrollTop = targetTop;
  syncScroll();
}

function nextMatch() {
  if (!state.searchMatches.length) return runSearch(true);
  state.searchIndex = (state.searchIndex + 1) % state.searchMatches.length;
  $('search-count').textContent = `${state.searchIndex + 1} / ${state.searchMatches.length}`;
  focusMatch();
}

function prevMatch() {
  if (!state.searchMatches.length) return runSearch(true);
  state.searchIndex = (state.searchIndex - 1 + state.searchMatches.length) % state.searchMatches.length;
  $('search-count').textContent = `${state.searchIndex + 1} / ${state.searchMatches.length}`;
  focusMatch();
}

$('search-input').addEventListener('input', () => runSearch(false));
$('search-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    e.shiftKey ? prevMatch() : nextMatch();
  }
  if (e.key === 'Escape') {
    clearSearch();
    $('search-input').blur();
  }
});
$('search-next').addEventListener('click', nextMatch);
$('search-prev').addEventListener('click', prevMatch);
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
    e.preventDefault();
    $('search-input').focus();
    $('search-input').select();
  }
});

// ==================================================================
// EDITOR
// ==================================================================

function setEditorValue(text) {
  $('editor').value = text;
  const lines = text.split('\n').length;
  $('editor-label').textContent = lines + ' line' + (lines === 1 ? '' : 's');
  refreshHighlight();
  syncScroll();
}

$('editor').addEventListener('input', () => {
  const lines = $('editor').value.split('\n').length;
  $('editor-label').textContent = lines + ' line' + (lines === 1 ? '' : 's');
  refreshHighlight();
  // re-count only; never steal focus while typing in the editor
  if ($('search-input').value) runSearch(false);
});

$('editor').addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const t = e.target, start = t.selectionStart, end = t.selectionEnd;
    t.value = t.value.substring(0, start) + '  ' + t.value.substring(end);
    t.selectionStart = t.selectionEnd = start + 2;
    refreshHighlight();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); $('save-btn').click(); }
});

// ---- boot ----
(async function boot() {
  refreshHighlight();
  if (!state.password) return showGate();
  const ok = await tryUnlock(state.password);
  if (!ok) showGate();
})();
</script>
